version: 1
id: p6a-ledger-reader
goal: "Build the second and last slice of the durable measurement corpus described in `docs/ADAPTIVE-WORKFLOW-PLAN.md` in the section headed P6, and nothing beyond that slice.\n\nRead that section, and the code the first slice left, before you draft anything. The document is in Russian; the contract you return is in English.\n\nThe first slice is in `main` and is the write path: one append-only corpus under `<UserConfig.home>/ledger/`, every producer delivering through one protocol, an allowlist projection, and a refusal to start new paid dispatch while the corpus cannot be written. This slice is the read path, and it owes points 7 and 8 of P6a and nothing else.\n\nPoint 8 is the reader. `warden ledger` stays local by default and keeps every field it prints today. An explicit global mode reads the home corpus from outside any repository, filtered by stable project identity rather than by path. One aggregator serves both sources and never sums a local tree together with the copy of it that reached the home. Known and unknown counts survive into the output, and a physical run instance is distinguishable from a lineage merged across continuations. A corrupt line or an unsupported schema version must not fail the report: it yields the file, the byte offset, a count of what was skipped and an `incomplete` marker, and an incomplete corpus must not print an unconditional success rate or an exact total spend. The command takes no arguments today, so a new flag is implementation, documentation and CLI checks, not a parse.\n\nPoint 7 is the import. One explicit, one-time import of selected local runs and archives through the same projector the write path uses. Importing the same source twice, importing a copy of it at another path, and importing an archive that overlaps a source already imported all leave the totals unchanged. Records with no event id need a deterministic provenance key and a stated copy-detection rule; an ambiguous match is flagged rather than merged. The import records when it ran, what version of the transform produced it, and how complete the source was. Contracts, units, lineage and launch receipts that the legacy evidence never had stay unknown rather than being inferred. No raw material is imported: the allowlist that guards delivery guards this too.\n\nWhat proves it is the groups in section 6.1 that the write path could not satisfy alone: 6 for legacy and import, 9 for corruption, and 1 in the full form the first slice deferred, where the global reader outside the repository returns the same calls, costs and outcomes after the project tree is deleted, and a copied finished corpus reads the same from another path. Group 10 applies as before and is now a regression rather than a promise: plain `warden ledger` prints what it prints today, every test writes to its own temporary home and never the operator's, and profiles, policy, the approval fingerprint, writer ownership and the rules of `land` do not change.\n\nConstraints: no third-party dependency, no new vendor call, nothing written outside the repository except a test's own temporary home. Do not build P6b: no grouping by dispatch conditions or contract version, no HTML, no dashboard, no estimator. Do not change the write protocol the first slice settled; if a defect in it blocks this slice, say so in the draft rather than repairing it here.\n\nREAD AT THIS BASE COMMIT (db5f7b8). What follows is what the tree says, not what the goal says.\n\nWHAT THE WRITE PATH LEFT. `LedgerReader.summarize(Path projectRoot)` is the only aggregator of `<projectRoot>/.warden/runs/*/evidence.jsonl`, and `Main.ledger()` calls it after `ConfigLoader.findProjectRoot(\".\")`, which throws outside a project; the command accepts no arguments. `HomeCorpus.records(Path home)` reads every line of every `ledger/segments/*.jsonl` and returns rows with no diagnostics. `MeasurementProjector.project(event)` returns a body, a provenance map and a content hash taken over the body with `at` and `seq` removed. `HomeCorpus.deliver(home, eventId, contentHash, body)` is a no-op on an identical id and hash and writes `conflicts.jsonl` on the same id with different content. `ProjectIdentity.resolve` writes `.warden/runs/.project-identity` when it is missing, so the reader needs a read-only resolution and must never mint one; constructing an `EvidenceLedger` runs recovery, so the reader must not construct one either.\n\nTHE UNIT PROBLEM, WHICH IS WHAT GROUP 1 IN FULL FORM ACTUALLY TESTS. Every paid call reaches the corpus twice in two shapes: as a `vendor_attempt` event journaled when the call returns, carrying its cost, tokens, duration and outcome, and again inside the enclosing `role_run.vendor_attempts` summary. `MeasurementProjector.accountingFor` already separates them - `vendor_attempt` carries `counts_as_new_calls: true` with `vendor_attempt_count: 1`, `role_run` is `role_summary` with `counts_as_new_calls: false`. The local reader compensates in the opposite direction: `LedgerReader.CORPUS_ONLY_EVENTS` hides `vendor_attempt`, `run_reserved`, `run_prepared` and `authority_denied` from the local view, and the local reader expands `role_run.vendor_attempts` into attempts itself, falling back to the enclosing event for historical records that carry no attempt array. The two sources therefore agree on calls, cost and outcomes only if the one aggregator counts by accounting unit on the corpus side and keeps that expansion on the local side. Summing every record of either source double-counts every call and every priced dollar.\n\nCORRUPTION AS IT BEHAVES TODAY. `LedgerReader.readEvents` calls `Json.parseObject` per line with no guard, so one corrupt local line makes `warden ledger` throw and print nothing. `HomeCorpus.readJsonl` does the opposite: it drops a corrupt middle line silently and stops at a corrupt last line, and that same function backs the delivery index rebuild. Neither reports a file, an offset or a count. Add the diagnostic read beside the one delivery uses rather than replacing it. The deliberate change to group 10 is that plain `warden ledger` keeps its output for a well-formed tree and stops failing outright on a damaged one.\n\nLEGACY SHAPE. `examples/demo/sample-evidence/demo-red/evidence.jsonl` is one line carrying `at`, `type`, `code`, `ok` and an absolute `report` path, with no `event_id`, no `project_id`, no `seq`, no run instance, no contract and no cost. That is the material the provenance key must be derived from and the set of things that must stay unknown after import. Delivery is keyed by event id, so importing modern evidence is already idempotent through the existing dedupe; only legacy rows need the new key. Note that re-projecting an event already delivered under an older transform yields a different content hash and so becomes an integrity conflict rather than a duplicate - a flag, not a merge, and the totals still hold.\n\nSURFACES THAT ASSERT THE OPPOSITE TODAY AND MUST BE CORRECTED WITH THE CODE. `docs/METRICS.md` states there is no `--global` flag and no second aggregator; `docs/ARCHITECTURE.md` states the same twice; the `--help` text describes `ledger` as aggregating local evidence. `examples/demo/run.sh` and `run.cmd` invoke `warden ledger` with no arguments in CI, and `examples/demo/README.md` says what that prints.\n\nNO DEFECT IN THE WRITE PROTOCOL BLOCKS THIS SLICE. The silent skip in `HomeCorpus.readJsonl` and the unguarded parse in `LedgerReader` are read-side gaps this slice is asked to close; delivery order, the acknowledgement, the journal, recovery, writer ownership and the dispatch refusal need no change for the reader or the import.\n\nDeliverable: `warden ledger` keeps its local scope, fields and numbers for a well-formed tree and gains an explicit global mode that reads `<UserConfig.home>/ledger/` from outside any repository filtered by stable project identity, with one aggregator serving both sources, counting a paid call once, keeping known and unknown counts, distinguishing a physical run instance from a merged lineage, and refusing an unconditional success rate or an exact total spend while a source is incomplete; plus one explicit, idempotent import of selected local runs and archives through the same allowlist projector, with a deterministic provenance key and a stated copy-detection rule for records that carry no event id. Done means acceptance groups 1 in full form, 6 and 9 of section 6.1 are covered by suites registered in `TestMain`, group 10 holds as a regression including the offline demo's no-argument invocation, and the flag, the import and the limits of legacy data are documented where the CLI is already documented."
non_goals:
  - "Do not edit .warden contract files or acceptance commands to make checks pass"
  - "Do not build P6b: no grouping by dispatch conditions, task kind/risk or contract version, no HTML report, no dashboard and no estimator"
  - "Do not change the write-then-deliver protocol the first slice settled: delivery order, the durable acknowledgement, the journal, idempotent recovery, per-writer segments and the `ledger_unavailable` dispatch refusal stay as they are; a defect that blocks this slice is reported in the run, not repaired here"
  - "Do not change what plain `warden ledger` prints for a well-formed local tree: same scope, same fields, same numbers, and the demo's no-argument invocation keeps printing what `examples/demo/README.md` says it prints"
  - "Do not let a read write: no identity is minted, no recovery is replayed and nothing is appended to the corpus by any read path, global or local"
  - "Do not make the import implicit: no read imports, and nothing is imported that the operator did not name"
  - "Do not infer legacy contracts, units, lineage, effort, cost or launch receipts that the evidence never carried; unknown stays unknown and is counted as unknown"
  - "Do not import raw material: goal, prompt, vendor reply, finding text, arbitrary error strings, argv, environment, credentials, diffs or absolute paths, and do not widen the allowlist to admit them"
  - "Do not add a third-party dependency, and do not add or repeat a vendor call to read or to recover a measurement"
  - "Do not write outside the repository except a test's own temporary home, and never into the operator's own `~/.warden`"
  - "Do not change user profiles, policy, the approval fingerprint, writer ownership or the rules of `land`, and do not add a role, stage or preset"
  - "Do not edit `.warden` contract files or acceptance commands to make checks pass, and do not delete or archive project trees automatically"
risk: medium
scope: platform
checks: fast

# The planner's own estimate, written in by hand on 2026-09-12 because the draft compiler
# does not carry it into the contract. Ten calls is one implement pass, two independent
# readings and two repair rounds with their rechecks, so a third repair stops for a person.
# The dollar figure is a ceiling, not a forecast: one reader on this roster reports no price.
budgets:
  max_role_runs: 10
  max_cost_usd: 25.0

# Not the project default of 10. One gate run here is this repository's own suite, which
# takes ten to thirteen minutes on this host, and the loop runs it twice per run.
timeout_minutes: 60
authority:
  workspace_write: true
  network: false
  land: false
visual_qa:
  required: false
  scenarios: []
