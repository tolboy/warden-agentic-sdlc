version: 1
id: p2-planner-draft
goal: "Give Warden a planner role that turns an operator's goal into a contract Warden itself has validated, so that the meaning of a run is fixed and checkable before the first paying implementer call.\n\nThis is stage P2 of docs/ADAPTIVE-WORKFLOW-PLAN.md and only its first change set: the planner role, the bootstrap contract that bounds it, the deterministic validation of what it returns, and its place in `warden do`. The interactive draft editor, TTL on network observations, mid-run acceptance versioning and subtask execution are named in the non-goals and are not part of this task.\n\nWHAT IS WRONG. Measured against the code at this base commit, not recalled.\n\n`Profile.ROLES` is `implementer, reviewer, architect, visual_qa`. A search for `planner` across `src/` returns nothing: there is no planner anywhere in the codebase. So the only path from a goal to a contract today is `TaskDraft`, which is deterministic string work. It slugs the goal, guesses from `TaskDraft.looksLikeUi` whether the goal sounds like a screen, and writes a starter contract. That is useful and has to keep working, but it is not a reading of the repository: it cannot say what the deliverable is, what is out of scope, which check that already exists would prove the work, or what access the work needs.\n\nThe consequence is that an unclear goal gets paid for twice. The implementer is the first model to read the repository, so it discovers the shape of the task with write access already granted, inside the run whose budget is being spent on building. Run `lh-render-cycle-20260907-r1` is the recorded case: about 97 minutes, three implementer calls and three max-effort reviews, ending `budget_exhausted`, on a task whose real answer turned out to be that production already contained the fix and local main was behind. That was a reading question answered by a writing loop.\n\nWHAT TO BUILD.\n\n1. `planner` AS A ROLE. Add `planner` to `Profile.ROLES` so that a profile can declare it, `Policy.roles` can name it, and `RoleResolver` resolves it by exactly the rules every other role gets: verified profiles only, the declared strategy, and the independence flag when the policy sets one. Leave `architect` alone. It is in that set today, ships no profile and owns no stage, and renaming or repurposing it would silently change what an existing ledger's `by_role` split means.\n\n2. A SHIPPED PROMPT AND SCHEMA. `UserSetup` writes `prompts/planner.md` and `schemas/planner.json` beside the three pairs it already writes, under the same never-overwrite rule. The schema requires the fields the plan names: a reference to the operator's original goal, `task_kind`, `deliverable`, `non_goals`, bounded `subtasks` with their dependencies, an acceptance mapping, whether the target is local or live, `required_access`, `risk`, an `estimate` and `stop_conditions`. The prompt tells the planner that it is read-only, that it gathers evidence before it drafts, and that each acceptance entry must name a check that already exists in the project rather than invent a command.\n\n3. A BOOTSTRAP CONTRACT FOR THE PLANNER ITSELF. The planner runs before a task contract exists, so a task contract cannot bound it. Bound it by the profile and by Warden instead: the profile's `limits.wall_clock_minutes` as now, one call with no repair, `read_only: true` enforced the only way Warden ever enforces it, which is the worktree content fingerprint taken around the call, and no authority to reach the network or to write. A planner that moved the tree is a protocol failure with its own code and a bounded retry policy, not an ordinary P1.\n\n4. PREPARATION MODE, SEPARATE FROM EXECUTION MODE. Add `warden do --prepare off|auto|always`, defaulting to `off` so that no existing project changes behaviour. `always` dispatches the planner. `auto` dispatches it only when the task id has no contract on disk yet, which is the deterministic reading of the plan's rule that a ready unambiguous contract should not have a model added to it. `off` never dispatches it. The mode that was in force is reported in the run's own JSON, so that reading a finished run tells you whether a model prepared it.\n\n5. WARDEN COMPILES THE DRAFT AND DOES NOT TRUST IT. The planner returns a draft, and Warden turns it into a frozen contract only through checks that fail loudly and name the field:\n\n   - every acceptance entry must resolve to a named check under `checks:` in `.warden/project.yaml`. A shell string the planner wrote is refused, and is never silently promoted to a trusted acceptance command;\n   - `scope` must be an existing named scope in that project, and an invented one is refused;\n   - the operator's original goal is carried into the contract verbatim. The planner may add to it and may not replace or drop it, and a draft whose goal reference does not match the goal Warden handed it is refused;\n   - `required_access` may not exceed what the invocation already authorised. A planner asking for `land`, or for network that was not granted, is refused rather than granted;\n   - a draft that fails the schema is a `role_artifact_schema_violation` like any other role's, with the raw output kept.\n\n   Use the same collector every other config problem uses, so that a refusal reads like the rest of Warden's refusals.\n\n6. `--draft-only` STILL SPENDS NOTHING BEYOND PREPARATION. With `--prepare always --draft-only`, the planner runs, the contract is written and validated, and the run stops there. No implementer, no gates, no reviewer. This is item 6 of the plan's own acceptance list.\n\n7. THE PLANNER'S CALL IS COUNTED. Its attempt, cost, tokens and duration enter the run's evidence as a role run, so that `warden ledger` splits it under `by_role.planner` and `CallPlan` reserves for it before dispatch instead of discovering it afterwards. Preparation is not free, and a report that shows it as free is the defect this repository already refuses everywhere else.\n\nCONSTRAINTS.\n\n- `TaskDraft` keeps working unchanged when no planner runs. Under `--prepare off` the contract written must be byte-for-byte what is written today.\n- Do not add a `warden draft` command. The plan permits it later as an alias; it is not needed for this result.\n- Do not change any existing failure code, the ledger schema or the report schema. New codes for the new refusals are expected and belong to the planner.\n- Do not write or edit profiles in the operator's `~/.warden`. This task ships templates and the ability to declare a planner; it does not decide who plans.\n- Do not add a DAG scheduler and do not run subtasks. The schema records them; nothing executes them here.\n- Do not make the planner mandatory anywhere, and do not change the shipped policy's roles or its workflow chain.\n\nTESTS. Registered in TestMain beside the existing suites, and named for the behaviour rather than for the method. At minimum: a profile declaring `role: planner` loads and resolves, and an unverified one is still refused `profile_unverified`; `--prepare off` writes the contract `TaskDraft` writes today; `--prepare auto` dispatches nothing when the contract exists and dispatches once when it does not; `--prepare always --draft-only` runs the planner and never dispatches the implementer; a bare shell string as an acceptance entry is refused; an invented scope is refused; a draft that drops or replaces the operator's goal is refused; a draft asking for authority the invocation did not grant is refused; a planner that writes to the worktree is reported as a protocol failure and its draft is not used; and the planner's call appears in the ledger under `by_role.planner` with its cost counted.\n\nDOCUMENTATION. `docs/ARCHITECTURE.md` gains the planner where it describes the roles and the order they run in, and says plainly that the planner drafts while Warden validates. `docs/METRICS.md` lists `planner` in the `by_role` split it already documents. Add the role to any reference that lists profile fields or roles. Say what is not built: the interactive editor, TTL on network observations, and subtask execution."
non_goals:
  - "Do not edit .warden contract files or acceptance commands to make checks pass"
  - "Do not write or edit profiles in the operator's ~/.warden; they are outside this repository"
  - "Do not add an interactive draft editor or anything that waits for a person mid-run"
  - "Do not add TTL or timestamps for network observations; that is a later slice of P2"
  - "Do not execute or schedule subtasks; the schema records them and nothing runs them"
  - "Do not add a warden draft command, and do not change what TaskDraft writes when no planner runs"
  - "Do not rename or repurpose the existing architect role"
  - "Do not change the shipped policy's roles or workflow chain"
risk: medium
scope: platform
authority:
  workspace_write: true
  network: false
  land: false
# The first change set of P2 only: the role, the bounds on it, and the validation of what
# it returns. Nine calls allows implement plus two reviews and two full repair rounds with
# their rechecks; the ceiling is there so a third repair stops for a person instead.
# timeout_minutes bounds one gate run, and this project's fast check is the whole suite,
# which took about 22 minutes at 1383 checks and is larger now.
budgets:
  max_role_runs: 9
  max_cost_usd: 30.0
max_fix_attempts: 2
timeout_minutes: 60

visual_qa:
  required: false
  scenarios: []
