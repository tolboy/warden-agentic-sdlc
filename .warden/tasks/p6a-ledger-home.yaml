version: 1
id: p6a-ledger-home
goal: "Build the first slice of the durable measurement corpus described in `docs/ADAPTIVE-WORKFLOW-PLAN.md` in the section headed P6, and nothing beyond that slice.\n\nRead that section, and the code it names, before you draft anything. The document is in Russian; the contract you return is in English.\n\nThis slice is the write path. It owes points 1 to 6 of P6a: the home and the schema, identity and the units of accounting, the allowlist projection, the exclusion of raw content, the durability of the write itself, and what happens when the corpus cannot be written, together with the wiring of the producers that already exist. Points 7 and 8, the import of surviving history and the reader with its global mode, are the second slice and must not be built here.\n\nWhat proves it is the groups in section 6.1 that the write path can satisfy on its own: 2 for the crash windows, 3 for concurrency and identity, 4 for the full lifecycle, 5 for a failing store, 7 for the absence of raw content, 8 for the context of a measurement. Group 1 applies in the form a test can check without the reader that does not exist yet: after a confirmed write, deleting the project tree leaves the corpus complete and readable from somewhere else. Group 10 applies as a constraint rather than a feature: `warden ledger` keeps the scope and the fields it prints today, every test writes to a temporary home and never to the operator's own, and profiles, policy, the approval fingerprint, writer ownership and the rules of `land` do not change. Groups 6 and 9 belong to the second slice.\n\nPoint 5 of P6a asks for something to be settled before the code rather than discovered during it: the order the two records are written in, the point at which one is durably acknowledged, the journal of what has not been delivered, and the idempotent recovery that replays delivery rather than execution. Decide it, and state it in the architecture document as part of this change set.\n\nConstraints: no third-party dependency, no new vendor call, and nothing written outside the repository except a test's own temporary home.\n\nWHAT EXISTS, READ AT THIS BASE COMMIT.\n\n`EvidenceLedger` writes one project-local tree: `<projectRoot>/.warden/runs/<run-id>/`, with `evidence.jsonl` appended by `append(type, evidence)` and per-stage `*.json` reports beside it. `append` adds only `at` and `type` and then copies the caller's map whole, so everything a producer puts in a report reaches the file, including prompt paths, resolutions, vendor messages and error text. `LedgerReader.summarize(Path projectRoot)` reads only that tree, and `warden ledger` in `Main` calls it with no arguments. There is no home corpus in the codebase: nothing under `src/` resolves a ledger directory inside `UserConfig.home`.\n\nThe producers that must all reach the corpus through one API are `RoleRunner` (`role_run`, `role_dry_run`, `role_quota_exhausted`, `role_failover`, and the unresolved role codes), `GateRunner` (`baseline_gate`, `machine_gate`), `VisualQaRunner` (`visual_qa`), `TaskLoop` (`task_run`, `task_dry_run`, `human_decision_pending`), `Preparation` (the reservation and `markPrepared`), and `Main` (the `human_decision` written at approve, and the preflight failure that writes `task_run` before the loop starts). `RoleRunner` and `TaskLoop` already hold a `UserConfig`; `GateRunner`, `VisualQaRunner` and the approve path in `Main` hold only a project root, so the home has to be threaded to them. Do not read the environment or call `UserConfig.defaultHome()` at a write site: that is precisely what would let a test write into the operator's own home, and the established test pattern is `UserConfig.load(temporaryHome)`.\n\nTHE WRITE PROTOCOL, SETTLED HERE AND TO BE WRITTEN INTO docs/ARCHITECTURE.md AS PART OF THIS CHANGE SET.\n\nOrder: local first, then shared. The shared record is derived from the local one, never the reverse. One call on the single API performs four steps.\n\n1. Identity and local write. The event receives `event_id`, `schema_version`, event time, type and a per-stream sequence; its line is appended to the run's local `evidence.jsonl` and forced to disk.\n2. Journal. The already-projected body, with the allowlist applied so the journal holds no raw content either, is appended to an outbox beside the run's evidence together with the event id and a content hash, and forced. The journal travels with the tree, so an undelivered measurement is discoverable from the tree that produced it.\n3. Shared write. The projected line is appended to this writer's segment under `<UserConfig.home>/ledger/` and forced. The durable acknowledgement is the return of that force: before it nothing may report the measurement as delivered, and after it the record survives deletion of the project tree.\n4. Delivery mark, best effort. A crash before it leaves the event undelivered in the journal, never lost.\n\nRecovery replays delivery, not execution. On the next run against that home, every journal row not marked delivered is re-appended. The corpus is deduplicated by `event_id`: the same id with the same content hash is a no-op, and the same id with different content is recorded as an integrity conflict rather than silently dropping one line. No vendor call is ever repeated to recover the metrics of a call already paid for.\n\nTwo JVMs must never interleave lines. Give each writer process its own segment, keyed by a writer identity (host, pid, process start), so one file is not appended from two processes at all; where a single file must be shared, take the exclusive OS lock that `JsonFile.underExclusiveLock` already implements. `JsonFile.writeAtomically` (temporary file, force, atomic move) is the existing model for single-file state such as a manifest, not for the append stream. Do not promise an atomic snapshot of a corpus copied while a writer is live: such a copy is either consistent by this protocol or explicitly incomplete.\n\nWHEN THE CORPUS CANNOT BE WRITTEN. A failure at step 3 leaves the local evidence and the journal intact and marks the run pending or error where the CLI can see it. New paid dispatch stops: `RoleRunner.DispatchGate.requireDispatch()` is the one choke point crossed before anything is spent and is where that refusal belongs. Settlement of a worker already running and the recording of a human decision are never blocked for analytics and are never re-dispatched. Pending means the tree is not yet safe to delete. After recovery, completeness is restored by reconciling journal against corpus, not by a timer. Calls made with `--prepare off`, planning-only runs, refusals before dispatch and a late approve all take this same path.\n\nIDENTITY AND UNITS OF ACCOUNTING. Project identity must be stable across paths and copies, so it is not the path. The run instance is separate from the operator's `run_id`, and two projects whose operators chose the same run id never merge. Lineage or parent for a `--continue`, stage, role invocation, vendor attempt and candidate fingerprint are linked as separate identifiers. An actual vendor attempt is counted once: the planner is a call and enters calls and spend, while repeated workflow summaries and totals carried through a resume are not new calls. Role success, workflow outcome and human accept stay three fields and three aggregates. Unknown lineage stays unknown rather than being guessed.\n\nPROJECTION AND THE EXCLUSION OF RAW CONTENT. The projection is an allowlist built field by field, including through nested structures, not a copy of the event with a few known keys removed, which is all the present `append` would give. A field nobody allowed does not pass merely because it is new. Nothing carrying text may enter: goal, prompt, vendor reply, finding text, arbitrary error strings, argv, environment, credentials, diffs or sources. A finding contributes its id, severity, status, stage and its closure and reopen links, and no text. The reference to raw material belongs in a local provenance index, and a portable export omits absolute paths, account names and private URLs by default. The absence of text does not make the home corpus safe to publish, and the documentation must say so.\n\nTHE CONTEXT OF A MEASUREMENT. Record a safe snapshot of the conditions a call ran under: wall-clock and turn limits, effective grants, prompt template and schema hashes, the Warden and adapter version where known, and requested, effective and reported model and effort each labelled with its source. Copying `role_contract` is not enough: `RoleContract.of` records roster, strategy, independence, profile, vendor, model, effort, `read_only` and two hashes, and carries no limits, no grants and no turn ceiling. Add the snapshot alongside it, and do not change `RoleContract`'s reuse comparison in passing, because that rule decides whether a carried verdict may stand. A missing value stays unknown and never becomes zero, and an effective setting that is unknown is never replaced by the requested one.\n\nTESTS. New suites registered in `TestMain`, which is an explicit registry, so a suite that is not listed does not run. Each uses its own temporary home and temporary project, with real files and real child processes wherever durability is the claim. At minimum: a confirmed write survives deleting the project tree and is readable from another path; a child process killed before the local write, between the local and the shared write, after the durable write but before the acknowledgement, and during recovery loses no confirmed event and counts none twice, with unfinished operations still distinguishable; two JVMs writing one home produce no interleaved lines and a defined order within a stream; the same id written twice is idempotent and the same id with a different payload is an integrity conflict; planning-only, a refusal before dispatch, a quota failover with several vendor attempts, a protocol retry, a repair with its recheck, a resume, a killed process and a late human accept each appear once and distinctly, with a carried summary adding no calls or spend; an unwritable home and a full home leave local evidence, a discoverable pending or error state and no new paid dispatch, while settlement and the human decision still land, and recovery replays only delivery; unique secret markers planted in goal, prompt, reply, finding text, error, a nested payload and argv or environment reach neither the corpus nor an export, and an unknown new field does not pass the allowlist; a change of turn limit, time limit, grants, effort, prompt, schema or contract version is distinguishable under an unchanged profile name. `warden ledger` keeps its present local scope and fields, and no test writes anywhere but its own temporary home.\n\nDOCUMENTATION. `docs/ARCHITECTURE.md` gains the protocol above, the home corpus and its place beside the local evidence. `docs/METRICS.md` says what the corpus records and what stays unknown. The final report states plainly that the import of surviving history and the global reader are not built here.\n\nDeliverable: A versioned, append-only measurement corpus under `<UserConfig.home>/ledger/` that every existing evidence producer writes to through one API, with stable identity, an allowlist projection that carries no raw content, a settled write-then-deliver protocol with a journal, a durable acknowledgement and idempotent replay, and a refusal to start new paid dispatch while the corpus cannot be written. Done means the protocol is stated in `docs/ARCHITECTURE.md`, the acceptance groups the write path can satisfy alone are covered by suites registered in `TestMain`, and `warden ledger` prints exactly what it prints today."
non_goals:
  - "Do not edit .warden contract files or acceptance commands to make checks pass"
  - "Do not build point 7 of P6a: no import of legacy runs or archives, no deterministic provenance key for records without IDs, and no copy detection"
  - "Do not build point 8 of P6a: no `--global` flag, no reader that works outside a repository, and no second aggregator"
  - "Do not change what `warden ledger` prints: the same local scope, the same fields, and no new arguments in this slice"
  - "Do not build P6b: no grouping by dispatch conditions, task kind or contract version, no HTML report, no dashboard and no estimator"
  - "Do not add a third-party dependency, and do not add or repeat a vendor call to recover metrics"
  - "Do not change `RoleContract`'s reuse comparison, the approval fingerprint, writer ownership, or the rules of `land`"
  - "Do not write to the operator's own `~/.warden`: tests pass a temporary home and nothing is written outside the repository besides that home"
  - "Do not delete or archive project trees automatically, and do not present the home corpus as safe to publish because it holds no text"
  - "Do not change user profiles or policy, and do not add a new role, stage or preset"
risk: medium
scope: platform
checks: fast

# Written in by hand on 2026-09-11, from the planner's own estimate in
# .warden/runs/p6a-1/artifacts/planner.json, which the draft compiler does not carry into
# the contract. Nine calls is implement, two readings, and two full repair rounds with
# their rechecks; the ceiling is there so a third repair stops for a person. The cost
# figure is a ceiling, not a forecast, because one reader on this roster reports no price.
budgets:
  # Raised from 9 on 2026-09-11 for the re-reading. Run p6a-1 spent 8 of them and a
  # continuation does not reset the count, so 9 would not buy two readings. Neither this
  # ceiling nor the two keys below are part of the acceptance fingerprint: what may be
  # spent reaching a verdict says nothing about what the verdict is about.
  max_role_runs: 12
  max_cost_usd: 30.0

# Zero for this run, and only this run. The five findings were repaired by hand, so the
# question put to the readers is whether that repair holds. A fix round would answer it by
# dispatching the implementer over work it did not write; a stop for a person is the honest
# answer to a blocker here.
max_fix_attempts: 0

# Not the project default of 10. One gate run here is this repository's own suite, measured
# at seven to eight minutes from a cold worktree with no out/, so ten minutes leaves no
# room for a slow moment and would fail the baseline on the clock rather than on the code.
timeout_minutes: 60
authority:
  workspace_write: true
  network: false
  land: false
visual_qa:
  required: false
  scenarios: []
