version: 1
id: a11y-snapshot-shows-the-control
goal: "Make the accessibility snapshot the browser harness takes into evidence a person can act on, and give the `visual_qa` role the one measurement it is asked for and does not get.\n\nWHAT IS WRONG. Measured by reading the code as it stands, not imagined.\n\n`a11ySnapshot` in scripts/visual-qa.mjs walks `Accessibility.getFullAXTree` and stops at the first 60 nodes in tree order. Tree order is document order, so on any real page those 60 are the skip link, the banner and the navigation. The control the scenario is about is not among them. `RunReport.a11yNames` then keeps the first 24 of those that have a name, and the text view prints the first 8. What a human sees at the gate is therefore the top of the page, printed identically under every scenario of the run, while the button the run is about appears nowhere.\n\nThree further defects in the same path:\n\nFIRST. A node carrying `ignored: true` is not in the accessibility tree at all: it is aria-hidden, or display:none, or otherwise unreachable by assistive technology. The adapter records the flag and `RunReport.a11yNames` drops it, so the report can print a role and a name for a control no screen reader can reach. Evidence that misleads is worse than no evidence.\n\nSECOND. An interactive node with no accessible name is collected by the adapter and then discarded by the report, whose `a11yNames` skips any node whose name is blank. A button with no accessible name is the single most useful finding a dump like this can produce, and it is precisely what is being thrown away.\n\nTHIRD. The design this came from asked for role, name, bounding box and focused. The bounding box was not implemented. It is the only field by which the `visual_qa` role can measure the two things it exists to judge, clipping and overlap. Without it that role is back to reading pixels, which is what the snapshot was added to stop.\n\nWHAT TO BUILD.\n\n1. RANK BEFORE CAPPING. The snapshot stays bounded, but the cap is applied to a ranked list rather than to document order. `runScenario` already holds `scenario.steps`, and `probe` already returns the box of the element each step matched, so the adapter knows what the scenario is about. The nodes the scenario names must be in the snapshot and must come first. After them, interactive nodes, named or not. After those, whatever else is named, until the cap. The property to hold is simple to state and is what the tests must pin: a page with two hundred nodes of chrome above the control still produces a snapshot in which the control is present and early.\n\n2. CARRY THE BOX AND THE IGNORED FLAG THROUGH. Each node in `visual-qa.json` gains its bounding box. `ignored` stops being recorded and then silently dropped: either such nodes are excluded from what a human is shown, or they are shown marked as unreachable. What must not happen is a row that reads like an ordinary control. Choose one and make the report say which it is.\n\n3. DO NOT DISCARD THE UNNAMED INTERACTIVE NODES. `RunReport.a11yNames` must stop filtering on a blank name. An interactive element with no accessible name is reported as such, legibly, so that a human reading the gate can see it. This is a finding, not noise.\n\n4. STOP REPEATING THE SAME LIST UNDER EVERY SCENARIO. The human view in `RunReport` prints the a11y line once per scenario, and for most runs those lines are identical. Print what belongs to the scenario, or print the shared part once for the run. The shape is yours; what is fixed is that the same eight rows must not be repeated under each of five scenarios.\n\nTESTABILITY IS PART OF THE TASK, NOT AN EXTRA. This code is only observable with a live browser, and the Java suite skips every node-dependent check when node is absent, so a change here can be green everywhere and still not have improved the evidence. The ranking must therefore be exercisable without starting a browser. The precedent to follow is `--validate-only`, which already answers a question about the adapter with no browser and no output directory, and which VisualQaTest already drives through `ProcessRunner` while skipping when node is missing. The report side is plain Java and is directly testable.\n\nTESTS. Extend src/test/java/dev/warden/VisualQaTest.java for the adapter and src/test/java/dev/warden/TaskLoopTest.java, which is where `RunReport` is covered today, for the report. Cover, at minimum: a node the scenario names survives a cap it would have missed in document order; a node marked ignored never appears in the human view as an ordinary control; an interactive node with no accessible name reaches the human view and is identifiable there; every node in `visual-qa.json` carries a bounding box; and a run with several scenarios does not print the same a11y rows under each of them.\n\nCONSTRAINTS.\n\n- Zero npm dependencies. The adapter is plain Node over CDP and that is a product claim, not a preference.\n- The snapshot stays bounded. The whole of `visual.data()` is written to the context file the `visual_qa` role is given, so an unbounded dump is paid for in tokens on every visual run.\n- Do not change the scenario grammar, the locator rule in `contractProblem`, or any failure code. This task is about what is photographed, not about what is refused.\n- Do not break `RunReport.stepEvidence` or `TaskLoop.screenshotsOf`, both of which read the same adapter JSON.\n- The Accessibility domain is enabled once per scenario today. Enabling it once per browser session instead is welcome if it is free to do, and is not worth complicating the code for."
non_goals:
  - "Do not edit .warden contract files or acceptance commands to make checks pass"
  - "Do not implement pixel-diff or screenshot baselines; that is a separate deferred decision"
  - "Do not change the scenario grammar, the locator rule, or any visual_qa failure code"
  - "Do not add an npm dependency to the adapter"
risk: medium
scope: platform
authority:
  workspace_write: true
  network: false
  land: false
# Two files and their tests, across JavaScript and Java, with a browser-free entry point to
# add. Larger than the land-message slice, about the size of status-tells-the-truth.
budgets:
  max_role_runs: 6
  max_cost_usd: 6.0
max_fix_attempts: 2
timeout_minutes: 60

visual_qa:
  required: false
  scenarios: []
