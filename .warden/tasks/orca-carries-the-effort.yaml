version: 1
id: orca-carries-the-effort
goal: "Let a profile say what reasoning effort its Orca-hosted worker should run at, and forward it, so that hosting a role in Orca stops costing the one thing the direct runner can express.\n\nWHAT IS WRONG. Measured against Orca 1.4.197 and the code as it stands.\n\n`orca orchestration worker-start` accepts `--effort <level>`, documented in its own usage as the reasoning effort for the selected model. `OrcaExecutor` never sends it: the start arguments it builds are `--task`, `--worktree`, `--agent`, `--model`, `--run`, `--from` and `--timeout-ms`, and nothing else. A profile's `args:` list, which is where every direct profile keeps its effort flag, is not passed through this runner at all and is not meant to be, because Orca launches its own agent rather than a command line Warden wrote.\n\nThe consequence is a false choice an operator is currently forced to make. `claude-review` pins Opus 5 at effort max and is invisible outside Warden's narration. `orca-claude-review` is the same model, appears in Orca's Agent Dashboard as a live agent session, and runs at whatever effort Orca gives its Claude agent, because there is no way to say. Nothing about the transport requires that trade: Orca has the flag, Warden simply does not use it.\n\nWHAT TO BUILD.\n\n1. A new optional top-level profile key, `effort`. It is a single token, and it is not validated against a list of levels: which levels a model accepts is Orca's business and a copy of that list here would go stale the first time a vendor adds one. What must be enforced is that it is present, non-blank, and one token, so that it cannot smuggle a second argument into the command Warden builds.\n\n2. `OrcaExecutor` forwards it as `--effort <value>` on `worker-start` when the profile declares one, and sends nothing when it does not. A profile that says nothing must produce exactly the command line it produces today.\n\n3. REFUSE `effort` ON A PROFILE THAT IS NOT ORCA-HOSTED. On `runner: direct` the effort already lives inside `args:`, and on `runner: local` there is no such concept at all. A second place to say the same thing is a second thing to drift, and this repository has now paid for that mistake twice in one week: a locator rule copied out of the adapter into the config parser, and a wait ceiling written as one constant in JavaScript and another in Java. Refuse it at parse time, in the same collector every other profile problem uses, and say why.\n\n4. MAKE THE SENT EFFORT READABLE AFTER THE FACT. A dry run of an Orca profile reports `command_preview: [\"claude\"]` today, which tells an operator nothing about how the worker will be launched. The role's evidence must record the agent, the model and the effort that were actually sent to `worker-start`, so a finished run can be read back and a person can tell a max-effort review from a default one. Where that belongs — the dry-run preview, the role report, or both — is yours, provided it is answerable from the evidence a run already writes and does not require a new schema field on the ledger.\n\nCONSTRAINTS.\n\n- Do not change what the direct runner does with `args:`. Nothing about the existing direct profiles may need editing to keep working.\n- Do not change any failure code, the ledger schema or the report schema.\n- Do not touch the profiles in the operator's home. They live outside this repository and are not yours to write.\n- Do not change which roles the shipped policy hosts where, and do not add an Orca profile to `UserSetup`'s templates. This task adds the ability to say a thing, not a decision about who says it.\n- Warden still never creates an Orca worktree; `runner: orca` still requires the run to be executing inside one. Nothing here changes that.\n\nTESTS. `runner: orca` is covered today by src/test/java/dev/warden/OrcaLifecycleTest.java and its neighbours, which drive the executor against a scripted Orca rather than a live app; the profile parser is covered by the profile checks in src/test/java/dev/warden/ConfigTest.java or ProfileVerifierTest.java, whichever already holds them. Cover, at minimum: a profile declaring an effort produces a `worker-start` argument list containing `--effort` followed by that value; a profile declaring none produces the argument list unchanged from today; `effort` on a direct profile is refused at parse time with a message naming the runner; a blank or multi-token effort is refused; and the effort that was sent is recoverable from the evidence the run writes.\n\nDOCUMENTATION. `docs/ARCHITECTURE.md` states the Orca trade in the section on which roles appear in the Agent Dashboard, and names losing the direct runner's guarantees as its price. One of those was the inability to pin effort. Correct that paragraph rather than leaving it to contradict the code, and add the key to whatever reference lists profile fields."
non_goals:
  - "Do not edit .warden contract files or acceptance commands to make checks pass"
  - "Do not write or edit profiles in the operator's ~/.warden; they are outside this repository"
  - "Do not change the direct or local runners' handling of args"
  - "Do not change which roles the shipped policy hosts under which runner"
risk: medium
scope: platform
authority:
  workspace_write: true
  network: false
  land: false
# One field, one argument, one refusal and their tests. Smaller than the a11y slice: the
# unknowns here are Orca's, and the contract deliberately leaves them to Orca.
budgets:
  max_role_runs: 4
  max_cost_usd: 4.0
max_fix_attempts: 2
timeout_minutes: 45

visual_qa:
  required: false
  scenarios: []
