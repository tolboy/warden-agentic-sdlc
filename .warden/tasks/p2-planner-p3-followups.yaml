version: 1
id: p2-planner-p3-followups
goal: "Close the three findings left open when the P2 planner change set was accepted, so that what the preparation reservation says about a run is true, so that the next step it prints can be followed, and so that the diagram the README opens with lines up.\n\nThese three were filed against the candidate accepted as run `p2-planner-4` and committed as `919096e`. They are narrow and were deliberately not blocking. This task is those three and nothing else: the design accepted in that commit is not reopened, and the P2 items still named as non-goals there stay non-goals here.\n\nFIRST. THE PREPARATION RESERVATION DESCRIBES A RUN THAT WILL NOT HAPPEN. Finding P2PLAN-17, filed by claude-review against `src/main/java/dev/warden/run/DoCommand.java:307`.\n\nThe reservation written before the planner is dispatched composes two different plans. `requested_cap` comes from the bootstrap, which allows the planner one call. `paying_stages` and `minimum_success_calls` come from the full workflow chain measured with a predicate that skips nothing. For `--prepare always` without `--draft-only`, `run.json` therefore records `sufficient_for_success: false` and names stages the run's own predicate would skip.\n\nThat is a reservation asserting the run cannot finish, on a run that then finishes, and naming stages that are never dispatched. `TaskLoop` writes the correct `budget_plan` for the same run a moment later, so the two records in one run disagree.\n\nMake the reservation state one coherent plan. Either the bootstrap's own, with a cap of one and `paying_stages` naming the planner alone, or the run's real ceiling measured with the same skip predicate the loop routes by. Which of the two is the right answer is yours to argue in the code, but a reservation that mixes the numerator of one with the denominator of the other is not an option. Look at `CallPlan` lines 149-156, 169-176 and 219-228, and at the plan `TaskLoop` builds at 343-344 for the shape that is already right.\n\nSECOND. THE NEXT STEP IT PRINTS CANNOT BE FOLLOWED. Finding P2PLAN-18, against `src/main/java/dev/warden/run/DoCommand.java:430`.\n\nAfter `--prepare always --draft-only`, the planner's spend lives on a reservation at one specific run id. The narration prints its next-step line with the literal string `<id>`, identical to the `--prepare off` case where no reservation exists. An operator who follows that line with an id of their own choosing starts a loop that never joins the reservation. The planner's call is then not counted against the run's budget, and a paid reservation is orphaned.\n\nThe run id is already in the JSON report at line 415; it is the narration that does not carry it. Print the id preparation actually reserved, so that following the printed line joins the reservation and the planner's call is counted, which is the behaviour this change set added and which `PlannerTest` at 433-442 exercises only by reusing the id by hand.\n\nTHIRD. THE DIAGRAM THE README OPENS WITH IS RAGGED. Finding P2PLAN-16, against `README.md:175` and `README.ru.md:158`.\n\nThe new \"(or planner)\" text overflows the ASCII box. `README.md` line 175 is six columns too wide and `README.ru.md` line 158 is eight, so the right border no longer meets the corners above and below it. Every line of the box must end at the same column as its corners, as line 176 and line 159 still do.\n\nThis one is a read-and-see check and it is not a test gap. Do not add a test that measures column widths in a README, and do not reflow the diagram beyond what alignment requires.\n\nCONSTRAINTS.\n\n- Do not reopen the accepted design. The planner role, its bootstrap bound, the draft compile, the `--prepare` modes and the preparation accounting were accepted as committed; this task repairs three defects in them.\n- Do not change any existing failure code, the ledger schema or the report schema.\n- Do not widen `--prepare` behaviour, add an interactive draft editor, add TTL to network observations, execute subtasks, or add a `warden draft` alias. Those remain the next slice of P2.\n- Do not write or edit profiles in the operator's `~/.warden`.\n- Whatever the first fix decides the reservation should say, `--prepare off` keeps writing exactly what it writes today.\n\nTESTS. The first two belong in `src/test/java/dev/warden/PlannerTest.java`, beside the checks that already cover the reservation and the join. Today that suite asserts the reservation only for `--draft-only`, where the predicate skips every stage and the record happens to be correct; add the case it does not cover, which is `--prepare always` going on to the loop, and read `run.json` for it. For the second, assert what the narration prints, since nothing registered in TestMain does. The third needs no test, as above.\n\nDOCUMENTATION. If the first fix changes what a reservation reports, say so wherever `budget_plan` and the preparation reservation are described, and nowhere else. Add a CHANGELOG entry for each of the three under the existing convention."
non_goals:
  - "Do not edit .warden contract files or acceptance commands to make checks pass"
  - "Do not write or edit profiles in the operator's ~/.warden; they are outside this repository"
  - "Do not reopen the planner design accepted as commit 919096e; this task repairs three defects in it"
  - "Do not add an interactive draft editor, TTL on network observations, subtask execution or a warden draft alias"
  - "Do not add a test that measures column widths in a README"
  - "Do not change what --prepare off writes today"
risk: medium
scope: platform
authority:
  workspace_write: true
  network: false
  land: false
# Three narrow repairs on accepted work. Six calls is implement plus two readings, one
# repair round, and both rechecks: exactly enough, with nothing left for a second repair.
# If one is needed the run stops for a person, which is the right answer on a slice this
# small. Astra reads first and cheaply; the ceiling is sized for the two Opus readings.
budgets:
  max_role_runs: 6
  max_cost_usd: 15.0
max_fix_attempts: 1
timeout_minutes: 60

visual_qa:
  required: false
  scenarios: []
