workflow:
  name: warden-do
  description: Run one prepared Warden task, surface its durable decision, and never land changes.
  version: 0.2.0
  entry_point: run_task
  input:
    task:
      type: string
      required: true
    project_dir:
      type: string
      required: true
    run_id:
      type: string
      required: true
    actor:
      type: string
      required: true
  limits:
    max_iterations: 4
    # Agent execution is bounded below; the remaining time is an explicit human-gate TTL.
    timeout_seconds: 86400
  runtime:
    checkpoint:
      every_agent: true

agents:
  - name: run_task
    type: script
    command: java
    args:
      - "-cp"
      - "{{ workflow.dir }}/../out/classes"
      - "dev.warden.Main"
      - "run"
      - "{{ workflow.input.task }}"
      - "--run-id"
      - "{{ workflow.input.run_id }}"
    working_dir: "{{ workflow.input.project_dir }}"
    # Warden permits task timeouts up to 240 minutes. Give shutdown/evidence writes 15 more.
    timeout: 15300
    routes:
      - to: human_approval
        when: "{{ run_task.output.exit_code == 0 }}"
      # A spent subscription with a named successor is not the same question as a failure.
      # Nothing is wrong with the work; what is being asked is who may finish it.
      - to: human_failover
        when: "{{ run_task.output.reason == 'failover_requires_confirmation' }}"
      - to: human_intervention

  # Option order is load-bearing. `conductor run --skip-gates` auto-selects the FIRST
  # option, so the refusing choice is first in both gates below: automation can decline
  # on a human's behalf, never accept on one. Reordering these would let a flag land work.
  - name: human_approval
    type: human_gate
    prompt: "Warden gates passed. Inspect the worktree diff, task-run.json, screenshots and {{ workflow.input.project_dir }}/.warden/runs/{{ workflow.input.run_id }}/decision.json."
    options:
      - label: Reject
        value: reject
        route: record_reject
      - label: Accept for manual landing
        value: accept
        route: record_accept

  - name: human_failover
    type: human_gate
    prompt: "{{ run_task.output.decision_reason }}\n\nSwitching changes who wrote the work, and on a small roster it can leave one vendor reviewing its own output. Inspect {{ workflow.input.project_dir }}/.warden/runs/{{ workflow.input.run_id }}/decision.json."
    options:
      - label: Abort
        value: abort
        route: record_abort
      - label: Switch to the named vendor
        value: switch
        route: record_switch

  - name: record_switch
    type: script
    command: java
    args: ["-cp", "{{ workflow.dir }}/../out/classes", "dev.warden.Main", "approve", "{{ workflow.input.run_id }}", "--decision", "switch", "--expected-updated-at", "{{ run_task.output.decision_updated_at }}", "--actor", "{{ workflow.input.actor }}"]
    working_dir: "{{ workflow.input.project_dir }}"
    timeout: 60
    routes:
      - to: switch_authorized
        when: "{{ record_switch.output.exit_code == 0 }}"
      - to: decision_record_failed

  - name: human_intervention
    type: human_gate
    prompt: "Warden stopped on a problem. Inspect {{ workflow.input.project_dir }}/.warden/runs/{{ workflow.input.run_id }}/task-run.json and decision.json. No worker is allowed to continue implicitly."
    options:
      - label: Abort
        value: abort
        route: record_abort
      - label: Permit a new retry run
        value: retry
        route: record_retry

  - name: record_accept
    type: script
    command: java
    args: ["-cp", "{{ workflow.dir }}/../out/classes", "dev.warden.Main", "approve", "{{ workflow.input.run_id }}", "--decision", "accept", "--expected-updated-at", "{{ run_task.output.decision_updated_at }}", "--actor", "{{ workflow.input.actor }}"]
    working_dir: "{{ workflow.input.project_dir }}"
    timeout: 60
    routes:
      - to: accepted
        when: "{{ record_accept.output.exit_code == 0 }}"
      - to: decision_record_failed

  - name: record_reject
    type: script
    command: java
    args: ["-cp", "{{ workflow.dir }}/../out/classes", "dev.warden.Main", "approve", "{{ workflow.input.run_id }}", "--decision", "reject", "--expected-updated-at", "{{ run_task.output.decision_updated_at }}", "--actor", "{{ workflow.input.actor }}"]
    working_dir: "{{ workflow.input.project_dir }}"
    timeout: 60
    routes:
      - to: rejected
        when: "{{ record_reject.output.exit_code == 0 }}"
      - to: decision_record_failed

  - name: record_abort
    type: script
    command: java
    args: ["-cp", "{{ workflow.dir }}/../out/classes", "dev.warden.Main", "approve", "{{ workflow.input.run_id }}", "--decision", "abort", "--expected-updated-at", "{{ run_task.output.decision_updated_at }}", "--actor", "{{ workflow.input.actor }}"]
    working_dir: "{{ workflow.input.project_dir }}"
    timeout: 60
    routes:
      - to: aborted
        when: "{{ record_abort.output.exit_code == 0 }}"
      - to: decision_record_failed

  - name: record_retry
    type: script
    command: java
    args: ["-cp", "{{ workflow.dir }}/../out/classes", "dev.warden.Main", "approve", "{{ workflow.input.run_id }}", "--decision", "retry", "--expected-updated-at", "{{ run_task.output.decision_updated_at }}", "--actor", "{{ workflow.input.actor }}"]
    working_dir: "{{ workflow.input.project_dir }}"
    timeout: 60
    routes:
      - to: retry_authorized
        when: "{{ record_retry.output.exit_code == 0 }}"
      - to: decision_record_failed

  - name: accepted
    type: terminate
    status: success
    reason: Human acceptance was durably recorded. Warden still performs no commit, merge or push.

  - name: rejected
    type: terminate
    status: failed
    reason: Human rejected the candidate. No changes were landed.

  - name: aborted
    type: terminate
    status: failed
    reason: Human aborted after a failed run. No changes were landed.

  - name: retry_authorized
    type: terminate
    status: failed
    reason: Human authorized a NEW run id after the blocker is addressed; this workflow does not silently reuse attempts or budgets.

  - name: switch_authorized
    type: terminate
    status: failed
    reason: "Human authorized a vendor substitution. It applies to a NEW run id: re-run with `warden run <task> --run-id <new> --continue {{ workflow.input.run_id }}`. This workflow does not reuse the attempt or the budget of the run that stopped."

  - name: decision_record_failed
    type: terminate
    status: failed
    reason: The human choice could not be written to Warden's durable decision record; fail closed.
