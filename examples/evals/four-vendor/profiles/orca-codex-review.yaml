version: 1
profile: orca-codex-review
role: reviewer
vendor: codex
model: gpt-6.1-sol
effort: medium
command: codex
runner: orca
read_only: true
prompt_delivery: workspace_file
limits:
  wall_clock_minutes: 15
prompt_template: prompts/reviewer.md
json_schema: schemas/reviewer.json
artifact:
  required_fields: [role, task_id, status, verdict, summary, findings]
verification:
  probe: 'warden probe orca --agent codex --model {{model}} --effort {{effort}} --worktree {{worktree}} --wait-minutes 4'
  expect: "probe-answer: matched"
  what_to_check: ["The worker reads the nonce file and settles with its exact word."]
