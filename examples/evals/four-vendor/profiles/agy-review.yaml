version: 1
profile: agy-review
role: reviewer
vendor: google
model: "gemini-3.8-flash-high"
effort: high
command: agy
runner: direct
read_only: true
prompt_delivery: argv
args: ["-p=Read the whole file {{prompt_file}} and do exactly what it asks. Open files with your view_file tool. Never create or edit a file. Your final answer is the single JSON object that file asks for, with nothing before or after it.", "--output-format", "json", "--model", "{{model}}", "--effort", "{{effort}}", "--mode", "plan", "--sandbox", "--add-dir", "{{repo_root}}", "--print-timeout", "15m", "--dangerously-skip-permissions"]
limits:
  wall_clock_minutes: 20
prompt_template: prompts/reviewer.md
json_schema: schemas/reviewer.json
artifact:
  required_fields: ["role", "task_id", "status", "verdict", "summary", "findings"]
quota:
  signatures: []
verification:
  probe: "agy -p \"Use your view_file tool to read schemas/reviewer.json in the current directory and reply with only its top-level title. Do not change files.\" --output-format json --model {{model}} --effort {{effort}} --mode plan --sandbox --add-dir . --print-timeout 5m --dangerously-skip-permissions"
  expect: "Reviewer artifact"
  what_to_check: ["The model reads a real local file and returns its title; model/effort in launch flags are requested settings, not vendor receipts."]
  note: "Configured 2026-10-21. No inferred cost or inherited verification stamp."
