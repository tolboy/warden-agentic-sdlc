name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} · JDK ${{ matrix.jdk }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        jdk: ["21", "25"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      # No cache step on purpose: there is nothing to cache. Warden downloads no
      # dependency at build time, and a green run here is also the offline-build proof.

      - name: Build and test (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./build.sh
          ./test.sh

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build.cmd || exit /b 1
          call test.cmd || exit /b 1

      - name: CLI answers without a config (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./bin/warden --version
          ./bin/warden --help

      - name: CLI answers without a config (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call bin\warden.cmd --version || exit /b 1
          call bin\warden.cmd --help || exit /b 1

  demo:
    name: Demo fixture (no vendor call)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Run the offline demo
        shell: bash
        run: |
          ./build.sh
          ./examples/demo/run.sh

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    env:
      # A pull request hands over its own base and head; a push hands over the commit it
      # started from and the one it ends at. Both are read as environment values rather than
      # interpolated into a shell line, so nothing carried by the event reaches a command.
      HYGIENE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HYGIENE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # Where no base is handed over at all, the range is read against the published
      # branch instead. A tag push and a manual run both arrive without one.
      HYGIENE_FALLBACK_BASE: origin/${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The range scans read commits, not only the tree, and checkout keeps one commit by
          # default. This repository builds from a bare JDK with no dependency to download, so
          # its history is the cheap part of the job.
          fetch-depth: 0

      # First, because everything below trusts it: the gate is checked against throwaway
      # repositories that contain the things it is supposed to reject.
      - name: The gate catches what it claims to
        run: scripts/hygiene-selftest.sh

      # These checks are the release gate that keeps a private path or a machine-local
      # identifier from returning to the tree. The patterns and the file lists they read are
      # in scripts/hygiene.sh, which is also runnable by hand before a push.
      #
      # Each check runs twice. The tip scan asks whether the tree is clean. The range scan asks
      # whether any commit in this push added one, which is the question a tip scan cannot ask:
      # a commit that adds a personal path and a commit that rewords it away leave a clean tip
      # and a published history that still carries the path.
      - name: No absolute personal paths
        run: scripts/hygiene.sh tip paths

      - name: No machine-local identifiers in documentation
        run: scripts/hygiene.sh tip uuids

      - name: No absolute personal paths in any pushed commit
        run: scripts/hygiene.sh range paths "$HYGIENE_BASE" "$HYGIENE_HEAD"

      - name: No machine-local identifiers in any pushed commit
        run: scripts/hygiene.sh range uuids "$HYGIENE_BASE" "$HYGIENE_HEAD"

      - name: Every documentation link resolves
        run: |
          status=0
          while IFS='|' read -r file target; do
            path="${target%%#*}"
            [ -z "$path" ] && continue
            case "$path" in http*|mailto:*) continue ;; esac
            if [ ! -e "$(dirname "$file")/$path" ]; then
              echo "::error file=$file::broken link to $path"
              status=1
            fi
          done <<< "$(git grep -noE '\]\([^)#][^)]*\)' -- '*.md' \
                      | sed -E 's/^([^:]+):[0-9]+:\]\((.*)\)$/\1|\2/')"
          exit $status
